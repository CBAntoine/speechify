plugins {
    id "com.android.application"
}

// Patch's TV app template. Patch (on the phone or a computer) turns it into each TV app the person
// makes: it rewrites the app id, name and version in the manifest, swaps in the app's icon, banner
// and pages (assets/app/), and signs the result with its own key. See patch/src/apk/index.mjs:
// the placeholders below must match TEMPLATE there, and assets/patch-template.json says which
// level of template this is (what Patch can count on it doing).
android {
    namespace "app.patch.tvapp"
    compileSdk 34

    defaultConfig {
        applicationId "app.patch.tvapp.template"
        // Fire TV sticks from 2016 run Android 5.1 (Fire OS 5).
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.0.0-template"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Patch re-signs every app it makes, so any key will do here.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
