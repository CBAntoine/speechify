<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Patch: your WiFi, by voice</title>
    <meta name="description" content="See and control the devices on your home WiFi, and tune up your network, by talking to Patch." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script id="boot" type="application/json">%%PATCH_BOOT%%</script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <main class="main" id="main">
        <header class="topbar">
          <div class="brand">
            <div class="brand__mark" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3.5 9.2a12 12 0 0 1 17 0M7 12.8a7 7 0 0 1 10 0M10.4 16.3a2.3 2.3 0 0 1 3.2 0"/><path d="M12 20.2h.01"/></svg>
            </div>
            <div class="brand__text">
              <strong>Patch</strong>
              <span>Everything on your WiFi</span>
            </div>
          </div>
          <label class="search topbar__search">
            <span class="sr-only">Search devices</span>
            <span id="searchIcon"></span>
            <input id="search" type="search" placeholder="Search devices, brands, rooms…" autocomplete="off" />
          </label>
          <span class="netchip" id="netchip" hidden></span>
          <div class="topbar__actions">
            <button class="btn btn--ghost" id="scanBtn" type="button"></button>
            <button class="btn btn--ghost" id="tuneBtn" type="button"></button>
            <button class="btn btn--ghost icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings"></button>
          </div>
        </header>
        <div class="progress" id="scanProgress" hidden><i></i></div>
        <section class="hero" id="hero" aria-label="Summary"></section>
        <section class="todo" id="todo" aria-label="Things that need you" hidden></section>
        <section class="tvapps" id="tvapps" aria-label="TV apps" hidden></section>
        <div class="toolbar">
          <div class="chips" id="filters" role="toolbar" aria-label="Show devices by type"></div>
          <div class="toolbar__right">
            <label class="select" id="roomWrap" hidden><span class="sr-only">Room</span><span id="roomIcon"></span><select id="roomSelect"></select></label>
            <div class="seg view-toggle" role="group" aria-label="Show devices as">
              <button type="button" data-view="cards" aria-pressed="true" aria-label="Cards" title="Cards"></button>
              <button type="button" data-view="list" aria-pressed="false" aria-label="List" title="List"></button>
            </div>
            <button class="btn btn--ghost icon-btn" type="button" id="exportBtn" title="Download the device list as a spreadsheet (CSV)" aria-label="Download the device list as a spreadsheet"></button>
          </div>
        </div>
        <div id="devices" aria-live="polite"></div>
      </main>

      <aside class="voice" id="voice" aria-label="Talk to Patch">
        <header class="voice__head">
          <div class="orb" id="orb" aria-hidden="true"><span class="orb__core"></span><span class="orb__ring"></span><span class="orb__ring orb__ring--2"></span></div>
          <div class="voice__title">
            <strong>Patch</strong>
            <span id="voiceStatus" role="status" aria-live="polite">Ready when you are</span>
          </div>
          <button class="btn btn--ghost icon-btn voice__close" id="voiceClose" type="button" aria-label="Close voice panel"></button>
        </header>
        <div class="voice__log" id="voiceLog"></div>
        <div class="voice__notice" id="voiceNotice" hidden></div>
        <form class="voice__input" id="voiceForm" autocomplete="off">
          <label class="sr-only" for="voiceText">Type to Patch</label>
          <input id="voiceText" maxlength="600" placeholder="Message Patch…" />
          <button class="btn icon-btn" id="voiceSend" type="submit" aria-label="Send"></button>
        </form>
        <div class="voice__controls" id="voiceControls"></div>
        <p class="voice__fine" id="voiceFine">Voice by ElevenLabs. Your devices are controlled from this computer, never from the cloud.</p>
      </aside>
    </div>

    <button class="voice-fab" id="voiceFab" type="button" aria-label="Talk to Patch">
      <span class="orb is-live"><span class="orb__core"></span></span>
      Talk to Patch
    </button>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Device details" aria-hidden="true"></aside>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true"></section>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
  </body>
</html>
