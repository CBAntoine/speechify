name: Neon Clips APK

on:
  push:
    paths:
      - "neon-clips/**"
      - ".github/workflows/neon-clips-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-clips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: neon-clips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licences and install the platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms/android-37.2"

      - name: Logic tests
        run: ./gradlew :core:test --console=plain

      # Without these secrets the APK is signed with a throwaway debug key, which is fine for
      # trying it out but means each build must be installed fresh rather than as an update.
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEONCLIPS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neonclips.jks"
            echo "NEONCLIPS_KEYSTORE=$RUNNER_TEMP/neonclips.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          NEONCLIPS_KEYSTORE_PASSWORD: ${{ secrets.NEONCLIPS_KEYSTORE_PASSWORD }}
          NEONCLIPS_KEY_ALIAS: ${{ secrets.NEONCLIPS_KEY_ALIAS }}
          NEONCLIPS_KEY_PASSWORD: ${{ secrets.NEONCLIPS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: neon-clips-apk
          path: neon-clips/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
