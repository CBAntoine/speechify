name: Shuttle Android app

# Builds the installable Android app (.apk) whenever Shuttle changes. Download
# it from the run's "Artifacts" section, unzip, and open the .apk on the phone.

on:
  push:
    paths:
      - 'shuttle/**'
      - '.github/workflows/shuttle-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shuttle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuttle/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired "tools" package, which the
          # current SDK manager no longer has.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the web app into the Android project
        run: npm run build:android

      - name: Build the APK
        working-directory: shuttle/android
        run: ./gradlew assembleDebug --no-daemon --init-script ci/maven-central.gradle

      - uses: actions/upload-artifact@v4
        with:
          name: shuttle-android-apk
          path: shuttle/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
