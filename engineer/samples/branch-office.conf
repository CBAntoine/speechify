        set mappedip "10.20.0.20"
        set extintf "wan1"
        set portforward enable
        set extport 3389
        set mappedport 3389
    next
    edit "VIP-WEB01"
        set uuid 7a0c4f2e-3d1b-51ef-8c4a-0f1e2d3c4b11
