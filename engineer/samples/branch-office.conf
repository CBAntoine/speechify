#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=netops-jlee
#conf_file_ver=48151623424200001
#buildno=1639
#global_vdom=1
config system global
    set admintimeout 60
    set alias "FortiGate-60F"
    set hostname "BR-TOR-FW01"
    set strong-crypto disable
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
        set alias "ISP-A"
        set snmp-index 1
    next
    edit "internal"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping https ssh fabric
        set type hard-switch
        set role lan
        set snmp-index 2
    next
    edit "dmz"
        set vdom "root"
        set ip 10.30.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
        set snmp-index 3
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 4
    next
    edit "To-Vendor"
        set vdom "root"
        set type tunnel
        set snmp-index 5
        set interface "wan1"
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SAMPLEONLYadminAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    next
    edit "netops-jlee"
        set trusthost1 10.20.0.0 255.255.255.0
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SAMPLEONLYjleeBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    next
end
config system snmp sysinfo
    set status enable
    set description "Toronto branch firewall"
    set location "Toronto"
end
config system snmp community
    edit 1
        set name "brtor-sample-community"
        config hosts
            edit 1
                set ip 10.20.0.50 255.255.255.255
            next
        end
    next
end
config system ntp
    set ntpsync enable
end
config system dns
    set primary 10.20.0.53
end
config system auto-script
    edit "nightly-config-check"
        set interval 86400
        set repeat 0
        set start auto
        set script "config system global
show
end"
    next
end
