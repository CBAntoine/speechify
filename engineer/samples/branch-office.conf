config vpn ipsec phase1-interface
    edit "To-Vendor"
        set interface "wan1"
        set peertype any
        set net-device disable
        set proposal 3des-sha1 aes128-sha1
        set dhgrp 2 5
        set remote-gw 198.51.100.20
        set psksecret ENC SAMPLEONLYpskEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
    next
end
config vpn ipsec phase2-interface
    edit "To-Vendor-P2"
        set phase1name "To-Vendor"
        set proposal 3des-sha1
        set pfs disable
        set src-subnet 10.20.0.0 255.255.255.0
        set dst-subnet 172.16.50.0 255.255.255.0
    next
end
config vpn ssl web portal
