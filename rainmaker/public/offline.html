<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f49c4" />
    <title>Offline · Rainmaker</title>
    <style>
      :root { --bg: #f5f5f2; --text: #191917; --muted: #55534d; --brand: #3e5fe0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111110; --text: #eeeeec; --muted: #b5b3ad; --brand: #6e8bff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px; display: grid; place-items: center; color: #fff;
        background: linear-gradient(145deg, #5b7cfa, #3247c9 60%, #22308f); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 auto 22px; max-width: 320px; color: var(--muted); }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M7.5 15.5c-2.5 0-4.5-1.9-4.5-4.3 0-2.2 1.7-4 3.9-4.3C7.7 4.6 9.7 3 12 3c2.9 0 5.3 2.2 5.6 5 2 .3 3.4 2 3.4 4 0 2-1.6 3.5-3.6 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M9 18.5 8 21M13 17.5l-1 3.5M17 18.5 16 21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>Rainmaker needs a connection to load your pipeline. Check your signal or Wi-Fi and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
